
services:
  db:
    image: postgres:13
    environment:
      POSTGRES_DB: eain_db
      POSTGRES_USER: admin_h_24
      POSTGRES_PASSWORD: hhh_e_ain25
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data

  app:
    build: .
    command: npm run dev
    ports:
      - '3000:3000'
    env_file: 
      - .env
    environment:
      DB_HOST: db
      DB_USER: admin_h_24
      DB_PASS: hhh_e_ain25
      DB_NAME: eain_db
      DB_PORT: 5432
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - db
    # Optional: uncomment for hot reload with mounted code
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

volumes:
  db_data:
